<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6d7cff">
<title>猫屿学习集</title>
<style>
  :root{
    --brand:#6d7cff; --brand2:#a06bff;
    --accent:#6d7cff; --accent2:#a06bff; --accent-ink:#5b6bff;
    --tint:rgba(109,124,255,.12);
    --bg:#eef1f6; --bg-2:#e8ecf5;
    --surface:rgba(255,255,255,.78); --surface-solid:#ffffff; --glass:rgba(255,255,255,.6);
    --line:rgba(25,35,70,.10); --line-strong:rgba(25,35,70,.16);
    --text:#1c2333; --text2:#5b6472; --text3:#98a0b0;
    --shadow:0 8px 30px rgba(30,40,80,.08); --shadow-sm:0 2px 10px rgba(30,40,80,.06);
    --green:#16a34a; --green-bg:rgba(22,163,74,.12);
    --red:#e5484d; --red-bg:rgba(229,72,77,.12);
    --amber:#b45309; --amber-bg:rgba(180,83,9,.12);
    --radius:16px;
  }
  body[data-module="home"]{ --accent:#c98a4b; --accent2:#e0a86a; --accent-ink:#b8793d; --tint:rgba(201,138,75,.14); --bg:#f6efe3; --bg-2:#f1e6d3; }
  body[data-module="shua"]{ --accent:#4f8ef7; --accent2:#7db2ff; --accent-ink:#3d7be6; --tint:rgba(79,142,247,.13); --bg:#edf3fc; --bg-2:#e2ecfa; }
  body[data-module="shiji"]{ --accent:#4a7fb5; --accent2:#7fb0d8; --accent-ink:#3a6ea5; --tint:rgba(74,127,181,.14); --bg:#e9f0f6; --bg-2:#dbe7f1; }
  body[data-module="bianjie"]{ --accent:#f0a35e; --accent2:#ffd28a; --accent-ink:#e08a3c; --tint:rgba(240,163,94,.16); --bg:#eef0f5; --bg-2:#e5e8ef; }
  body[data-theme="dark"]{
    --brand:#8b96ff; --brand2:#b98cff; --accent-ink:#aab6ff;
    --surface:rgba(28,33,52,.82); --surface-solid:#1c2134; --glass:rgba(28,33,52,.6);
    --line:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.18);
    --text:#eef1f8; --text2:#aab2c4; --text3:#7a8294;
    --shadow:0 8px 30px rgba(0,0,0,.35); --shadow-sm:0 2px 10px rgba(0,0,0,.3);
    --green:#34d399; --green-bg:rgba(52,211,153,.15);
    --red:#f87171; --red-bg:rgba(248,113,113,.15);
    --amber:#fbbf24; --amber-bg:rgba(251,191,36,.15);
  }
  body[data-theme="dark"][data-module="home"]{ --bg:#1d1a15; --bg-2:#2a2419; --tint:rgba(224,168,106,.18); }
  body[data-theme="dark"][data-module="shua"]{ --bg:#121a2a; --bg-2:#16233a; --tint:rgba(125,178,255,.16); }
  body[data-theme="dark"][data-module="shiji"]{ --bg:#101828; --bg-2:#132033; --tint:rgba(127,176,216,.16); }
  body[data-theme="dark"][data-module="bianjie"]{ --bg:#14151f; --bg-2:#1b1c29; --tint:rgba(255,210,138,.16); }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--text);background:var(--bg);
    background-image:radial-gradient(1200px 500px at 80% -10%, var(--tint), transparent 60%),
      radial-gradient(900px 500px at -10% 30%, var(--tint), transparent 55%);
    background-attachment:fixed;
    -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    line-height:1.55;transition:background .3s,color .3s;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,textarea,select{font-family:inherit;color:var(--text);}
  ::selection{background:var(--tint);}

  /* ===== 顶栏 ===== */
  .topbar{position:sticky;top:0;z-index:40;background:linear-gradient(120deg,var(--brand),var(--brand2));
    color:#fff;box-shadow:0 4px 18px rgba(40,50,120,.18);}
  .topbar-in{max-width:1080px;margin:0 auto;padding:12px 18px 12px 20px;display:flex;align-items:center;gap:12px;}
  .topbar .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.18);display:flex;align-items:center;
    justify-content:center;font-size:20px;flex:none;cursor:pointer;backdrop-filter:blur(4px);}
  .topbar .brand-txt{min-width:0;cursor:pointer;}
  .topbar .brand-txt .sys{font-size:16.5px;font-weight:800;letter-spacing:.5px;line-height:1.2;}
  .topbar .brand-txt .page{font-size:12px;opacity:.92;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar .spacer{flex:1;}
  .topbar .top-actions{display:flex;gap:8px;align-items:center;}
  .icon-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.16);color:#fff;display:flex;align-items:center;
    justify-content:center;font-size:17px;transition:background .15s;}
  .icon-btn:hover{background:rgba(255,255,255,.28);}

  /* ===== 左侧浮动「模板库」按钮 ===== */
  .drawer-toggle{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:80;
    writing-mode:vertical-rl;letter-spacing:4px;padding:18px 10px;font-size:14px;font-weight:700;color:#fff;
    background:linear-gradient(180deg,var(--brand),var(--brand2));border-radius:0 14px 14px 0;
    box-shadow:4px 0 18px rgba(40,50,120,.25);cursor:pointer;transition:opacity .2s;}
  .drawer-toggle:hover{filter:brightness(1.05);}
  .drawer-toggle.hidden{opacity:0;pointer-events:none;}

  /* ===== 抽屉 ===== */
  .drawer-mask{position:fixed;inset:0;z-index:95;background:rgba(15,18,28,.4);backdrop-filter:blur(2px);opacity:0;
    pointer-events:none;transition:opacity .28s;}
  .drawer-mask.show{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;left:0;top:0;bottom:0;z-index:96;width:min(360px,86vw);
    background:var(--glass);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);
    border-right:1px solid var(--line);box-shadow:12px 0 40px rgba(20,30,60,.18);
    transform:translateX(-105%);transition:transform .3s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;}
  .drawer.show{transform:translateX(0);}
  .drawer-head{padding:22px 20px 16px;border-bottom:1px solid var(--line);}
  .drawer-head .t{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .drawer-head .s{font-size:12px;color:var(--text3);margin-top:3px;}
  .drawer-body{flex:1;overflow:auto;padding:16px 14px 24px;}
  .drawer-label{font-size:11.5px;font-weight:700;letter-spacing:2px;color:var(--text3);margin:6px 8px 10px;}
  .mod-card{display:flex;align-items:center;gap:12px;padding:14px 14px;border-radius:15px;cursor:pointer;
    background:var(--surface);border:1px solid var(--line);margin-bottom:10px;transition:transform .15s,box-shadow .15s,border-color .15s;}
  .mod-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent);}
  .mod-card .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none;
    background:var(--mod-tint,var(--tint));}
  .mod-card .nm{font-size:15px;font-weight:800;}
  .mod-card .sm{font-size:12px;color:var(--text3);margin-top:1px;}
  .mod-card .go{margin-left:auto;color:var(--text3);font-size:18px;}

  /* ===== 主区域 ===== */
  .main{max-width:1080px;margin:0 auto;padding:20px 18px 60px;}
  .view{display:none;}
  .view.active{display:block;animation:fade .22s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}

  .card{background:var(--surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:18px;}
  .section-title{font-size:13px;font-weight:700;color:var(--text2);letter-spacing:.5px;margin:22px 2px 10px;display:flex;align-items:center;gap:7px;}
  .section-title::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--accent);}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;border-radius:11px;
    padding:10px 15px;transition:background .15s,transform .05s,box-shadow .15s;min-height:42px;background:var(--surface);border:1px solid var(--line);color:var(--text2);}
  .btn:active{transform:scale(.97);}
  .btn:hover{border-color:var(--line-strong);}
  .btn-primary{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff;border:none;}
  .btn-primary:hover{box-shadow:0 6px 16px var(--tint);}
  .btn-ghost{background:transparent;border:1px solid var(--line);}
  .btn-danger{color:var(--red);}
  .btn-block{width:100%;}
  .btn-lg{min-height:50px;font-size:15px;}
  .btn-sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:9px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  input.inp,textarea.inp,select.inp{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px 13px;font-size:14px;
    background:var(--surface);outline:none;transition:border-color .15s;}
  input.inp:focus,textarea.inp:focus,select.inp:focus{border-color:var(--accent);}
  textarea.inp{resize:vertical;line-height:1.6;}

  .chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;
    background:var(--surface);border:1px solid var(--line);cursor:pointer;color:var(--text2);transition:all .15s;}
  .chip.active{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;}
  .chip:hover{border-color:var(--accent);}
  .chip .chip-del{margin-left:2px;opacity:.6;}
  .chip .chip-del:hover{opacity:1;}

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .stat{background:var(--surface);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;box-shadow:var(--shadow-sm);}
  .stat b{display:block;font-size:22px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--accent);}
  .stat span{display:block;font-size:11.5px;color:var(--text3);margin-top:4px;}
  .empty{text-align:center;padding:46px 20px;color:var(--text3);}
  .empty .em{font-size:40px;margin-bottom:10px;}

  /* ===== 弹窗（通用） ===== */
  .dialog-mask{position:fixed;inset:0;z-index:120;background:rgba(15,18,28,.45);display:none;align-items:center;justify-content:center;padding:20px;}
  .dialog-mask.show{display:flex;}
  .dialog{background:var(--surface-solid);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);
    width:100%;max-width:400px;padding:22px;animation:up .2s ease;}
  .dialog h3{font-size:17px;font-weight:800;margin-bottom:8px;}
  .dialog .msg{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:20px;white-space:pre-wrap;}
  .dialog .acts{display:flex;gap:10px;}
  .dialog .acts .btn{flex:1;}
  @keyframes up{from{transform:translateY(18px);opacity:0;}to{transform:none;opacity:1;}}

  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#23272e;color:#fff;
    font-size:13.5px;padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:all .2s;z-index:300;max-width:86%;
    display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast .undo{color:#ffd28a;font-weight:700;cursor:pointer;pointer-events:auto;flex:none;}

  /* ===== 刷刷刷 刷题页 ===== */
  .quiz-top{position:sticky;top:60px;z-index:20;background:var(--bg);backdrop-filter:blur(10px);padding:10px 0;margin-bottom:12px;}
  .quiz-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .back-btn{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--text2);padding:6px 8px 6px 0;font-weight:600;}
  .quiz-title{font-size:15px;font-weight:700;}
  .quiz-meta{display:flex;align-items:center;gap:7px;}
  .quiz-count{font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums;}
  .mini-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text2);}
  .mini-btn.on{background:var(--amber-bg);color:var(--amber);border-color:transparent;}
  .progress{height:5px;background:var(--line);border-radius:999px;margin-top:10px;overflow:hidden;}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px;transition:width .25s;}

  .q-card{margin-top:10px;}
  .q-meta{display:flex;align-items:center;gap:8px;margin-bottom:13px;flex-wrap:wrap;}
  .qtype{display:inline-flex;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:6px;background:var(--tint);color:var(--accent-ink);}
  .qno{font-size:12.5px;color:var(--text3);font-variant-numeric:tabular-nums;}
  .q-text{font-size:17px;font-weight:600;line-height:1.65;white-space:pre-wrap;word-break:break-word;}
  .opts{margin-top:18px;display:flex;flex-direction:column;gap:10px;}
  .opt{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:13px;
    padding:13px 14px;font-size:15px;background:var(--surface);transition:border-color .12s,background .12s;line-height:1.5;}
  .opt .letter{flex:none;width:26px;height:26px;border-radius:8px;background:var(--bg);border:1px solid var(--line);display:flex;
    align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--text2);margin-top:1px;}
  .opt .txt{flex:1;word-break:break-word;}
  .opt.selected{border-color:var(--accent);background:var(--tint);}
  .opt.selected .letter{background:var(--accent);border-color:var(--accent);color:#fff;}
  .opt.correct{border-color:var(--green);background:var(--green-bg);}
  .opt.correct .letter{background:var(--green);border-color:var(--green);color:#fff;}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt.wrong .letter{background:var(--red);border-color:var(--red);color:#fff;}
  .opt.dim{opacity:.62;}
  .opt .mark{margin-left:auto;font-size:16px;flex:none;}
  .judge-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;}
  .judge-btn{border:1.5px solid var(--line);border-radius:13px;padding:18px;font-size:17px;font-weight:700;background:var(--surface);text-align:center;transition:all .12s;}
  .judge-btn.selected{border-color:var(--accent);background:var(--tint);color:var(--accent-ink);}
  .judge-btn.correct{border-color:var(--green);background:var(--green-bg);color:var(--green);}
  .judge-btn.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red);}
  .short-area{margin-top:18px;}
  .short-area textarea{width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:13px;padding:12px 14px;font-size:15px;background:var(--surface);line-height:1.6;color:var(--text);}
  .short-area textarea:focus{outline:none;border-color:var(--accent);}
  .answer-box{margin-top:16px;border-radius:13px;padding:14px 15px;font-size:14.5px;line-height:1.65;}
  .answer-box .h{font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:6px;}
  .answer-box.ok{background:var(--green-bg);border:1px solid rgba(22,163,74,.3);}
  .answer-box.ok .h{color:var(--green);}
  .answer-box.no{background:var(--red-bg);border:1px solid rgba(229,72,77,.3);}
  .answer-box.no .h{color:var(--red);}
  .answer-box .ref{background:var(--surface);border-radius:9px;padding:10px 12px;margin-top:8px;font-size:14px;color:var(--text2);}
  .answer-box .ref b{color:var(--text);}
  .quiz-foot{margin-top:20px;}
  .quiz-foot .row{display:flex;gap:10px;}
  .quiz-foot .row .btn{flex:1;}
  .timer-chip{font-size:12.5px;color:var(--text2);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px;}

  .result-hero{text-align:center;padding:26px 18px 22px;}
  .result-hero .big{font-size:52px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent);}
  .result-hero .lbl{font-size:13px;color:var(--text3);margin-top:8px;}
  .result-sub{display:flex;justify-content:center;gap:26px;margin-top:14px;}
  .result-sub div{text-align:center;}
  .result-sub b{font-size:19px;font-variant-numeric:tabular-nums;}
  .result-sub span{display:block;font-size:11.5px;color:var(--text3);margin-top:2px;}
  .wrong-note{margin-top:18px;background:var(--amber-bg);border:1px solid rgba(180,83,9,.3);border-radius:13px;padding:12px 14px;font-size:13.5px;color:var(--amber);display:flex;align-items:center;gap:8px;}
  .r-item{border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:10px;background:var(--surface);}
  .r-item .q{font-size:14.5px;font-weight:600;margin-bottom:6px;}
  .r-item .a{font-size:13px;color:var(--text2);}
  .r-item .a b{color:var(--text);}
  .r-item .a .ok{color:var(--green);font-weight:700;}
  .r-item .a .no{color:var(--red);font-weight:700;}

  .type-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px;}
  .type-card{position:relative;background:var(--surface);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow-sm);padding:16px;text-align:left;transition:transform .1s,border-color .15s,box-shadow .15s;overflow:hidden;}
  .type-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent);}
  .type-card .tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;margin-bottom:9px;background:var(--tint);color:var(--accent-ink);}
  .type-card .tag i{width:7px;height:7px;border-radius:50%;background:currentColor;}
  .type-card h3{font-size:17px;font-weight:800;}
  .type-card .sub{font-size:12px;color:var(--text3);margin-top:3px;}
  .type-card .cnt{position:absolute;top:14px;right:14px;font-size:12px;color:var(--text3);}
  .more-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .more-card{background:var(--surface);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow-sm);padding:16px;display:flex;align-items:center;gap:12px;transition:transform .1s,border-color .15s;}
  .more-card:hover{transform:translateY(-3px);border-color:var(--accent);}
  .more-card .ic{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;background:var(--tint);}
  .more-card h4{font-size:15px;font-weight:700;}
  .more-card .sub{font-size:12px;color:var(--text3);margin-top:1px;}
  .more-card .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:999px;display:flex;align-items:center;justify-content:center;}

  .wb-item{border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:12px;background:var(--surface);}
  .wb-item .q{font-size:14.5px;font-weight:600;line-height:1.55;margin:8px 0;}
  .wb-item .meta{font-size:12.5px;color:var(--text2);margin-bottom:10px;line-height:1.6;}
  .wb-item .meta .ok{color:var(--green);font-weight:700;}
  .wb-item .meta .no{color:var(--red);font-weight:700;}
  .wb-item .acts{display:flex;gap:8px;flex-wrap:wrap;}
  .wb-item .acts .btn{flex:1;}

  /* ===== 拾绩册 ===== */
  .sj-topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .sj-topbar .search-box{flex:1;min-width:180px;position:relative;}
  .sj-topbar .search-box input{padding-right:36px;}
  .sj-topbar .search-box .icon{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.5;}
  .catnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;}
  .bm-card{background:var(--surface);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:15px;overflow:hidden;
    cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;}
  .bm-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--accent);}

  function p2(n){ return (n<10?"0":"")+n; }

  /* ================= 刷刷刷 模块 ================= */

  var bank=[], byId={};
  var S=null, sel=null, revealed=false, graded=false;
  var timerStart=0, timerTick=null;
  function cleanOpt(s){ return String(s==null?"":s).replace(/^\s*[A-Za-z][.、．:：)）\s]+/,"").trim(); }
  function letterIdx(l){ return LETTERS.indexOf(String(l).toUpperCase()); }
  function norm(arr){ return (Array.isArray(arr)?arr:[arr]).map(function(x){return String(x).toUpperCase();}).filter(function(x){return x&&letterIdx(x)>=0;}).sort().join(""); }
  function shuaLoadBank(){
    var custom=store.get(K.custom,[]);
    bank=(Array.isArray(custom)?custom:[]).filter(function(q){ return q&&q.id&&q.type&&q.question; });

  function getQ(id){ return byId[id]; }
  function optsOf(q){ if(q.type==="judge"&&(!q.options||!q.options.length)) return ["正确","错误"]; return q.options||[]; }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
  function shuaStats(){
    var s=store.get(K.stats,{}), w=store.get(K.wrong,{});
    var done=0,correct=0,wrong=0; for(var k in s){ done++; correct+=s[k].correct||0; wrong+=s[k].wrong||0; }
    var acc=(correct+wrong)>0?Math.round(correct/(correct+wrong)*100):0;
    return { total:bank.length, done:done, correct:correct, wrong:wrong, acc:acc, wrongCount:Object.keys(w).length, marks:Object.keys(store.get(K.marks,{})).length };
  }
  function typeCount(t){ var n=0; bank.forEach(function(q){ if(q.type===t) n++; }); return n; }
  function typeDone(t){ var s=store.get(K.stats,{}),n=0; bank.forEach(function(q){ if(q.type===t&&s[q.id]) n++; }); return n; }
  function savedSessionInfo(){ var s=store.get(K.session,null); if(s&&s.queue&&s.queue.length&&s.idx<s.queue.length) return s; return null; }
  function saveSession(){ if(!S) return; var n=S.idx; if(revealed&&graded) n=S.idx+1; if(n>=S.queue.length){ store.del(K.session); return; }

  function shuaShowPractice(){ $("#view-shua").classList.add("active"); renderQuestion(); }
  function sampleIds(ids){ var mode=store.get(K.mode,"rand"); var arr=mode==="seq"?ids.slice():shuffle(ids);
    var n=parseInt(store.get(K.num,0),10)||0; if(n>0&&arr.length>n) arr=arr.slice(0,n); return arr; }
  function startSession(type,ids){ if(!ids.length){ toast("暂无题目"); return; }
    S={type:type,queue:ids,idx:0,correct:0,wrong:[],total:ids.length}; sel=null;revealed=false;graded=false;

  function startType(t){ var saved=savedSessionInfo(); if(saved&&saved.type===t){ resumeSession(); return; }
    var ids=bank.filter(function(q){return q.type===t;}).map(function(q){return q.id;}); startSession(t,sampleIds(ids)); }
  function startMixed(){ var saved=savedSessionInfo(); if(saved&&saved.type==="mixed"){ resumeSession(); return; }
    var ids=bank.filter(function(q){return q.type==="single"||q.type==="multi"||q.type==="judge";}).map(function(q){return q.id;}); startSession("mixed",sampleIds(ids)); }
  function startWrong(){ var saved=savedSessionInfo(); if(saved&&saved.type==="wrong"){ resumeSession(); return; }
    var w=store.get(K.wrong,{}); var ids=Object.keys(w).filter(function(id){return byId[id];}); startSession("wrong",ids); }
  function startMarked(){ var saved=savedSessionInfo(); if(saved&&saved.type==="marked"){ resumeSession(); return; }
    var m=store.get(K.marks,{}); var ids=Object.keys(m).filter(function(id){return byId[id];}); startSession("marked",ids); }
  function sessionTitle(){ if(S.type==="mixed") return "综合刷题"; if(S.type==="wrong") return "错题重刷"; if(S.type==="marked") return "标记复习";

  function restart(){ var t=S?S.type:null; store.del(K.session); if(t==="wrong") startWrong(); else if(t==="mixed") startMixed(); else if(t==="marked") startMarked(); else if(t) startType(t); }

  function renderQuestion(){
    var q=getQ(S.queue[S.idx]); if(!q){ S.idx++; if(S.idx>=S.queue.length){ finish(); return; } renderQuestion(); return; }
    var total=S.queue.length, idx=S.idx; var pct=Math.round(idx/total*100);
    var marks=store.get(K.marks,{}); var marked=!!marks[q.id];
    var html='<div class="quiz-top"><div class="quiz-row">'+
      '<button class="back-btn" onclick="APP.quit()">‹ 返回</button>'+
      '<span class="quiz-title">'+sessionTitle()+'</span>'+

        '<span class="timer-chip" id="shuaTimer">'+fmtSec(elapsedSec())+'</span>'+

        '<span class="quiz-count">'+(idx+1)+' / '+total+'</span>'+

    var m=({single:{n:"单选题"},multi:{n:"多选题"},judge:{n:"判断题"},short:{n:"简答题"}})[q.type];
    html+='<div class="card q-card"><div class="q-meta"><span class="qtype">'+m.n+'</span><span class="qno">'+esc(q.id)+'</span></div>'+
      '<div class="q-text">'+esc(q.question)+'</div>';

    if(q.type==="single"||q.type==="multi"){
      html+='<div class="opts">';

        if(q.type==="single"){ if(revealed){ if(letter===String(q.answer).toUpperCase()){cls+=" correct";mark="✓";} else if(sel===letter){cls+=" wrong";mark="✕";} else cls+=" dim"; }
          else if(sel===letter) cls+=" selected"; }
        else { var inSel=sel&&sel.indexOf(letter)>=0, inAns=norm(q.answer).indexOf(letter)>=0;
          if(revealed){ if(inAns){cls+=" correct";mark="✓";} else if(inSel){cls+=" wrong";mark="✕";} else cls+=" dim"; }
          else if(inSel) cls+=" selected"; }
        html+='<button class="'+cls+'" data-letter="'+letter+'"><span class="letter">'+letter+'</span><span class="txt">'+esc(cleanOpt(opt))+'</span>'+(mark?'<span class="mark">'+mark+'</span>':'')+'</button>';
      });
      html+='</div>';
    } else if(q.type==="judge"){
      html+='<div class="judge-grid">';
      optsOf(q).forEach(function(opt,i){ var letter=LETTERS[i], cls="judge-btn";
        if(revealed){ if(letter===String(q.answer).toUpperCase()) cls+=" correct"; else if(sel===letter) cls+=" wrong"; }
        else if(sel===letter) cls+=" selected";
        html+='<button class="'+cls+'" data-letter="'+letter+'">'+esc(cleanOpt(opt))+'</button>'; });
      html+='</div>';
    } else if(q.type==="short"){

    }

    if(revealed){
      if(q.type==="short"){
        html+='<div class="answer-box ok"><div class="h">📝 参考答案</div><div class="ref">'+esc(q.answer||"（无）")+'</div>'+(q.explanation?'<div class="ref" style="margin-top:6px"><b>解析：</b>'+esc(q.explanation)+'</div>':'')+'</div>';
        if(!graded){ html+='<div class="judge-grid"><button class="judge-btn" style="border-color:var(--green);color:var(--green);" onclick="APP.markShort(true)">我答对了 ✓</button><button class="judge-btn" style="border-color:var(--red);color:var(--red);" onclick="APP.markShort(false)">我答错了 ✕</button></div>'; }
        else html+='<div class="answer-box '+(S.wrong.indexOf(q.id)>=0?"no":"ok")+'"><div class="h">'+(S.wrong.indexOf(q.id)>=0?"已记入错题本":"本题已掌握")+'</div></div>';
      } else {
        var ok=S.wrong.indexOf(q.id)<0; var ansTxt=q.type==="multi"?norm(q.answer).split("").join("、"):String(q.answer).toUpperCase();
        html+='<div class="answer-box '+(ok?"ok":"no")+'"><div class="h">'+(ok?"✓ 回答正确":"✕ 回答错误")+'<span style="font-weight:500;color:var(--text2)"> 正确答案：'+ansTxt+'</span></div>'+(q.explanation?'<div class="ref"><b>解析：</b>'+esc(q.explanation)+'</div>':'')+'</div>';

    html+='<div class="quiz-foot">';

  function confirm(){ if(revealed) return; var q=getQ(S.queue[S.idx]); var ok;
    if(q.type==="multi"){ if(!(sel&&sel.length)) return; ok=norm(sel)===norm(q.answer); }
    else { if(sel==null) return; ok=String(sel).toUpperCase()===String(q.answer).toUpperCase(); }

  function revealShort(){ if(revealed) return; revealed=true; renderQuestion(); }
  function markShort(ok){ var q=getQ(S.queue[S.idx]); graded=true; applyResult(q,ok); renderQuestion(); }
  function applyResult(q,ok){ if(ok) S.correct++; else S.wrong.push(q.id);
    var st=store.get(K.stats,{}); var s=st[q.id]||{correct:0,wrong:0}; if(ok) s.correct++; else s.wrong++; st[q.id]=s; store.set(K.stats,st);
    var w=store.get(K.wrong,{}); if(ok){ delete w[q.id]; } else { var e=w[q.id]||{times:0}; e.times++; e.last=Date.now(); w[q.id]=e; } store.set(K.wrong,w); saveSession(); }
  function toggleMark(){ var q=getQ(S.queue[S.idx]); if(!q) return; var m=store.get(K.marks,{}); if(m[q.id]) delete m[q.id]; else m[q.id]=1;

  function next(){ S.idx++; if(S.idx>=S.queue.length){ finish(); return; } sel=null;revealed=false;graded=false; saveSession(); renderQuestion(); }
  function quit(){ confirmBox("退出本次刷题？","进度已自动保存，下次进入可从当前题继续。",function(){ stopTimer(); S=null; shuaRenderHome(); }); }

  function inflateRaw(u8){
    return new Promise(function(res,rej){
      try{ var ds=new DecompressionStream("deflate-raw"); var stream=new Blob([u8]).stream().pipeThrough(ds);
        new Response(stream).arrayBuffer().then(function(buf){ res(new Uint8Array(buf)); },rej); }
      catch(e){ rej(e); } });
  }
  function zipEntries(u8){
    var dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength), len=u8.length, eocd=-1;
    for(var i=len-22;i>=Math.max(0,len-65557);i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
    if(eocd<0) throw new Error("不是有效的 Word 文档（ZIP）");
    var count=dv.getUint16(eocd+10,true), p=dv.getUint32(eocd+16,true), td=new TextDecoder("utf-8"), out=[];
    for(var n=0;n<count;n++){
      if(dv.getUint32(p,true)!==0x02014b50) break;
      var method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true);
      var nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true);
      var lho=dv.getUint32(p+42,true), lnl=dv.getUint16(lho+26,true), lel=dv.getUint16(lho+28,true);
      var name=td.decode(u8.subarray(p+46,p+46+nlen));
      var ds=lho+30+lnl+lel;
      out.push({name:name,method:method,data:u8.subarray(ds,ds+csize)});
      p+=46+nlen+elen+clen;
    }
    return out;
  }
  function docxXmlToText(xml){
    var doc=new DOMParser().parseFromString(xml,"application/xml");
    if(doc.getElementsByTagName("parsererror").length) throw new Error("docx 内容解析失败");
    var W="http://schemas.openxmlformats.org/wordprocessingml/2006/main";
    function textOf(node){ var out="";
      (function walk(n){ Array.prototype.slice.call(n.childNodes||[]).forEach(function(c){
        if(c.nodeType===3){ out+=c.nodeValue; return; }
        var ln=c.localName||"";
        if(ln==="t"){ out+=(c.textContent||""); }
        else if(ln==="tab"){ out+="\t"; }
        else if(ln==="br"||ln==="cr"){ out+="\n"; }
        else walk(c);
      }); })(node);
      return out;
    }
    function cellText(tc){ var parts=[];
      Array.prototype.slice.call(tc.children||[]).forEach(function(ch){ if((ch.localName||"")==="p") parts.push(textOf(ch).replace(/\n/g," ")); });
      return parts.length?parts.join(" "):"";
    }
    var lines=[];
    var body=doc.getElementsByTagNameNS(W,"body")[0]||doc.documentElement;
    (function collect(n){ Array.prototype.slice.call(n.children||[]).forEach(function(c){
      var ln=c.localName||"";
      if(ln==="p"){ lines.push(textOf(c)); }
      else if(ln==="tbl"){ Array.prototype.slice.call(c.getElementsByTagNameNS(W,"tc")).forEach(function(tc){ var t=cellText(tc); if(t) lines.push(t); }); }
      else collect(c);
    }); })(body);
    var res=[];
    lines.forEach(function(l){ String(l||"").split(/\n/).forEach(function(s){ s=s.replace(/ /g," ").replace(/[ \t]+$/,""); if(s.trim()) res.push(s); }); });
    return res.join("\n");
  }
  function docxToText(u8){
    var entry=null;
    zipEntries(u8).forEach(function(e){ if((e.name||"").replace(/\\/g,"/")==="word/document.xml") entry=e; });
    if(!entry) throw new Error("未找到 word/document.xml");
    return (entry.method===8?inflateRaw(entry.data):Promise.resolve(entry.data)).then(function(data){
      return docxXmlToText(new TextDecoder("utf-8").decode(data));
    });
  }
  function tcToText(tc){
    var s="", prev=null;
    (tc.items||[]).forEach(function(it){
      if(it.str){ if(prev){ var gap=it.transform[4]-(prev.transform[4]+prev.width); var f=Math.abs(prev.transform[0])||Math.abs(prev.transform[3])||12; if(gap>f*0.25) s+=" "; }
        s+=it.str; prev=it; }
      if(it.hasEOL){ s+="\n"; prev=null; }
    });
    return s;
  }
  function parsePdf(file){
    var lib=window.pdfjsLib; if(!lib) return Promise.reject(new Error("未加载 PDF 组件"));
    try{ lib.GlobalWorkerOptions.workerSrc="pdf.worker.min.js"; }catch(e){}
    return file.arrayBuffer().then(function(buf){
      return lib.getDocument({data:buf}).promise.then(function(pdf){
        var p=Promise.resolve(), out=[];
        for(var i=1;i<=pdf.numPages;i++){ (function(n){ p=p.then(function(){ return pdf.getPage(n).then(function(page){ return page.getTextContent().then(function(tc){ out.push(tcToText(tc)); }); }); }); })(i); }
        return p.then(function(){ return out.join("\n"); });
      });
    });
  }
  function parseQuestions(text){
    var lines=String(text||"").split(/\r?\n/).map(function(s){ return s.replace(/ /g," ").replace(/\t/g," ").trim(); });
    var raws=[], cur=null, hint="";
    // 先整体识别「答案表」：整行都由 “题号.答案 / 题号:答案” 组成（如 1.D 2.A / 251:ABCD / 291.B（错误））
    var tokRe=/(\d{1,4})\s*[.、．:：)）]\s*([A-Ha-h]{1,4}|对|错|正确|错误|√|×|是|否)(?:\s*[（(][^)）]*[)）])?/g;
    var keyMap={}, keySet={};
    lines.forEach(function(line,idx){
      var s=String(line||"").trim(); if(!s) return;
      var tokens=[], pos=0, ok=true;
      while(pos<s.length){
        var sp=s.slice(pos).match(/^[\s,，;；、]+/);
        if(sp){ pos+=sp[0].length; continue; }
        tokRe.lastIndex=pos; var m=tokRe.exec(s);
        if(!m || m.index!==pos){ ok=false; break; }
        tokens.push({num:m[1],ans:m[2]}); pos=tokRe.lastIndex;
      }
      if(ok && tokens.length){ tokens.forEach(function(t){ keyMap[t.num]=t.ans; }); keySet[idx]=true; }
    });
    function flush(){ if(cur) raws.push(cur); cur=null; }
    function secTypeOf(s){ if(/判断|是非/.test(s)) return "judge"; if(/多选|多项/.test(s)) return "multi"; if(/单选/.test(s)) return "single"; if(/简答|问答|论述|名词解释|填空/.test(s)) return "short"; return ""; }
    function qNum(line){
      var m=line.match(/^第\s*(\d{1,4})\s*题\s*[:：.、．)）]?\s*(.+)$/); if(m&&m[2].trim()) return {num:m[1],rest:m[2].trim()};
      m=line.match(/^[（(]\s*(\d{1,4})\s*[）)]\s*(.+)$/); if(m&&m[2].trim()) return {num:m[1],rest:m[2].trim()};
      m=line.match(/^(\d{1,4})\s*[.、．:：)）]\s*(.+)$/); if(m&&m[2].trim()) return {num:m[1],rest:m[2].trim()};
      return null;
    }
    function optLine(line){
      var m=line.match(/^([A-Ha-h])\s*[.、．:：)）]\s*(.+)$/)||line.match(/^([A-Ha-h])[ 　]+(.+)$/);
      return m?{letter:m[1].toUpperCase(),text:m[2].trim()}:null;
    }
    function inlineAns(s,q){
      s=s||"";
      var am=s.match(/(?:参考答案|正确答案|标准答案|答案)\s*[:：]\s*(.*?)(?=(?:【?解析|$))/);
      if(am){ q.answer=am[1].trim(); s=s.slice(0,am.index)+s.slice(am.index+am[0].length); }
      var em=s.match(/(?:解析|【解析】)\s*[:：]\s*(.+)$/);
      if(em){ q.explanation=em[1].trim(); s=s.slice(0,em.index); }
      return s.trim();
    }
    function splitInlineOptions(text){
      text=text||"";
      var re=/([A-H])\s*[.、．:：)）]\s*/g, m, markers=[];
      while((m=re.exec(text))) markers.push({letter:m[1].toUpperCase(),start:m.index,end:re.lastIndex});
      if(markers.length<2) return {question:text,options:[]};
      var q=text.slice(0,markers[0].start).trim();
      if(q.length<2) return {question:text,options:[]};
      var opts=[];
      for(var i=0;i<markers.length;i++){ var st=markers[i].end, en=(i+1<markers.length)?markers[i+1].start:text.length;
        var o=text.slice(st,en).trim(); if(o) opts.push(o); }
      return {question:q,options:opts};
    }
    for(var i=0;i<lines.length;i++){
      if(keySet[i]) continue;
      var raw=lines[i]; if(!raw) continue;
      var st=secTypeOf(raw);
      if(st && raw.length<=20 && !/^[0-9第(（]/.test(raw) && !/[?？]$/.test(raw)){ hint=st; flush(); continue; }
      var qn=qNum(raw);
      if(qn){ flush(); var tmp={answer:"",explanation:""}; var qtext=inlineAns(qn.rest,tmp);
        var sp=splitInlineOptions(qtext);
        cur={num:qn.num,question:sp.question,options:sp.options,answer:tmp.answer,explanation:tmp.explanation}; continue; }
      if(!cur) continue;
      var ol=optLine(raw);
      if(ol && cur.options.length<8){ cur.options.push(ol.text); continue; }
      if(/答案|参考答案|正确答案|标准答案/.test(raw) && !/解析/.test(raw)){ var am=raw.match(/(?:参考答案|正确答案|标准答案|答案)\s*[:：]?\s*(.*)$/); if(am){ var av=(am[1]||"").trim(); if(!/^\s*\d{1,4}\s*[.、．:：)）]/.test(av)) cur.answer=av; } continue; }
      if(/解析|【解析】/.test(raw)){ var em=raw.match(/(?:解析|【解析】)\s*[:：]?\s*(.*)$/); if(em) cur.explanation=(em[1]||"").trim(); continue; }
      if(cur.options.length){ cur.options[cur.options.length-1]+=" "+raw; }
      else if(!cur.answer && cur.question.length<300){ cur.question+=" "+raw; }
    }
    flush();
    function judgeVal(s){ s=String(s||"").trim();
      if(/^(正确|对|√|✓|是|true|t|y|yes)$/i.test(s)||s==="√"||s==="✓") return "A";
      if(/^(错误|错|×|✗|否|非|false|f|n|no)$/i.test(s)||s==="×"||s==="✗") return "B";
      return null; }
    function finalize(r){
      var opts=(r.options||[]).map(function(o){ return String(o==null?"":o).trim(); }).filter(Boolean);
      var rawAns=String(r.answer||"").trim();
      if(!rawAns && keyMap[r.num]) rawAns=String(keyMap[r.num]).trim();
      var letterAns=(rawAns.match(/[A-Ha-h]/g)||[]).join("").toUpperCase();
      var j=judgeVal(rawAns);
      var allJudge=opts.length>=2&&opts.every(function(o){ return judgeVal(o)!==null; });
      var q={question:String(r.question||"").trim(),options:opts,answer:"",explanation:String(r.explanation||"").trim()};
      if(!q.question) return null;
      if(opts.length===0){
        if(j!==null || hint==="judge"){ q.type="judge"; q.options=["正确","错误"]; q.answer=(j!==null?j:(letterAns==="B"?"B":"A")); }
        else { q.type="short"; q.answer=rawAns; }
      }
      else if(allJudge||(j!==null&&letterAns==="")){ q.type="judge"; q.options=["正确","错误"]; q.answer=(j!==null?j:(letterAns==="B"?"B":"A")); }
      else if(letterAns.length>1){ q.type="multi"; q.answer=letterAns; }
      else if(letterAns.length===1){ q.type="single"; q.answer=letterAns; }
      else { q.type=(hint==="multi"?"multi":hint==="judge"?"judge":hint==="short"?"short":"single"); q.answer=""; if(q.type==="judge") q.options=["正确","错误"]; }
      if(q.type==="short"){ q.options=[]; if(!q.answer) q.answer=rawAns; }
      if(q.type==="single"||q.type==="multi") q.answer=String(q.answer||"").toUpperCase().split("").filter(function(c){ return c>="A"&&c<="H"; }).join("");
      if(q.type==="judge"){ q.answer=(q.answer==="B")?"B":"A"; q.options=["正确","错误"]; }
      return q;
    }
    return raws.map(finalize).filter(Boolean);
  }
  function importBankFile(file){
    var name=(file.name||"").toLowerCase(), type=file.type||"";
    var isPdf=/\.pdf$/.test(name)||type==="application/pdf";
    var isDocx=/\.docx$/.test(name)||type.indexOf("wordprocessingml")>=0;
    if(!isPdf&&!isDocx){ toast("请选择 .docx 或 .pdf 文件"); return; }
    toast("正在解析题库…");
    var done=function(text){
      var qs=parseQuestions(text);
      if(!qs.length){ toast("未解析到题目，请检查文件格式"); return; }
      var custom=store.get(K.custom,[]); if(!Array.isArray(custom)) custom=[];
      var c={single:0,multi:0,judge:0,short:0};
      qs.forEach(function(q){ c[q.type]=(c[q.type]||0)+1;
        custom.push({id:uid(),type:q.type,question:q.question,options:q.options,answer:q.answer,explanation:q.explanation||undefined}); });
      store.set(K.custom,custom); shuaLoadBank();
      if(document.body.getAttribute("data-module")==="shua") shuaRenderHome();
      toast("已导入 "+qs.length+" 题（单选 "+c.single+" · 多选 "+c.multi+" · 判断 "+c.judge+" · 简答 "+c.short+"）");
    };
    if(isDocx){ file.arrayBuffer().then(function(buf){ docxToText(new Uint8Array(buf)).then(done,function(e){ toast("Word 解析失败："+(e&&e.message||e)); }); },function(){ toast("读取文件失败"); }); }
    else { parsePdf(file).then(done,function(e){ toast("PDF 解析失败："+(e&&e.message||e)); }); }
  }

  function initMusic(){ var audio=$("#musicAudio"); player.audio=audio; audio.volume=0.8;
